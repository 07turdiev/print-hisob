# Printer Hisob — nginx site config
# O'rnatish:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/printer-hisob
#   sudo ln -s /etc/nginx/sites-available/printer-hisob /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Frontend: dashboard/dist (statik, SPA). Backend: 127.0.0.1:8000 ga proxy.
# Frontend va API bir xil origin'da bo'lgani uchun CORS kerak emas.

server {
    listen 80;
    server_name _;            # o'z domeningizga almashtiring, masalan: hisob.example.uz

    # Katta print paketlari uchun (ko'p job bir so'rovda).
    #
    # Agent uzoq uzilishdan keyin butun buferini (`MaxBufferedJobs`, standart
    # 50 000 hodisa) bitta to'plamda yuboradi. Bitta hodisa ~350 bayt JSON,
    # ya'ni to'liq bufer ~18 MB. 32m — deyarli ikki baravar zaxira bilan.
    #
    # MUHIM: bu qiymat kamaytirilsa nginx `413` qaytaradi va agent `2xx`
    # olmagani uchun buferni tozalamaydi — o'sha to'plamni abadiy qayta
    # yuboraveradi. Server tomondagi ikkinchi chegara:
    # `app/schemas.py: MAX_JOBS_PER_BATCH`.
    client_max_body_size 32m;

    # ---- Frontend (Vue build) ----
    root /home/user/print-hisob/dashboard/dist;
    index index.html;

    # SPA: mavjud fayl bo'lmasa index.html ga qaytaramiz (Vue Router uchun)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik assetlarni uzoq kesh
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Backend (FastAPI) ----
    # /api, /health, /docs, /openapi.json → uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Swagger hujjatlari (ixtiyoriy — jamoat serverida yopib qo'yish mumkin)
    location /docs        { proxy_pass http://127.0.0.1:8000/docs; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
